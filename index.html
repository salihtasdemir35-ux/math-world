<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MATH WORLD – Keşfet, Oyna, Öğren!</title>
<meta name="theme-color" content="#2F7BEA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   MATH WORLD – Stil dosyası
   Tema: kareli matematik defteri + oyuncak blok butonlar
   ========================================================= */
*{box-sizing:border-box}
:root{
  --sky:#E4F3FF;--sky2:#CBE8FF;--paper:#FFFFFF;--card:#FFFFFF;
  --ink:#1D2A4D;--muted:#5D6B8F;--line:#D3E1F3;--grid:rgba(47,123,234,.11);
  --sun:#FFC63A;--sun-d:#D99B00;--blue:#2F7BEA;--blue-d:#1C59B5;
  --leaf:#21A659;--leaf-d:#167E41;--grape:#8857F2;--grape-d:#6236C7;
  --orange:#FF8736;--orange-d:#D2611A;--rose:#F2557A;--rose-d:#C2325A;
  --teal:#13A89E;--teal-d:#0C7D75;
  --okbg:rgba(33,166,89,.14);--nobg:rgba(242,85,122,.13);--hintbg:#FFF4CF;--hintink:#4A3A00;
  --shadow:0 6px 0 rgba(29,42,77,.10);--r:22px;
  --font:"Nunito",ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky:#13203F;--sky2:#1C2C55;--paper:#1B2A50;--card:#22335F;--ink:#F1F5FF;--muted:#AFC0E6;
    --line:#35497C;--grid:rgba(255,255,255,.05);--shadow:0 6px 0 rgba(0,0,0,.35);
    --hintbg:#3B3416;--hintink:#FFE9A6;
  }
}
:root[data-theme="dark"]{
  --sky:#13203F;--sky2:#1C2C55;--paper:#1B2A50;--card:#22335F;--ink:#F1F5FF;--muted:#AFC0E6;
  --line:#35497C;--grid:rgba(255,255,255,.05);--shadow:0 6px 0 rgba(0,0,0,.35);
  --hintbg:#3B3416;--hintink:#FFE9A6;
}
html.hc{--sky:#FFFFFF;--sky2:#EEEEEE;--paper:#FFFFFF;--card:#FFFFFF;--ink:#000;--muted:#222;--line:#000;--grid:transparent;--hintbg:#FFF2A8;--hintink:#000}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;height:100%}
html.big{font-size:118%}
body{margin:0;min-height:100%;font-family:var(--font);color:var(--ink);background-color:var(--sky);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input{font:inherit}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
#app{max-width:1060px;margin:0 auto;padding:0 12px 48px}
#view{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Üst çubuk ---------- */
#topbar[hidden]{display:none}
#topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;
  padding:8px 10px;margin:0 -12px 14px;background:var(--paper);border-bottom:3px solid var(--line)}
.tb-av{font-size:1.8rem;width:48px;height:48px;border-radius:50%;background:var(--sky2);display:grid;place-items:center;border:3px solid var(--sun);flex:none}
.tb-who{flex:1;min-width:0}
.tb-name{font-weight:900;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-name small{font-weight:800;color:var(--muted);margin-left:6px}
.xpbar{height:13px;background:var(--sky2);border-radius:99px;overflow:hidden;margin-top:4px;border:2px solid var(--line)}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),#62D98F);border-radius:99px;transition:width .5s}
.pill{display:inline-flex;align-items:center;gap:4px;font-weight:900;background:var(--sky);border:2px solid var(--line);border-radius:99px;padding:5px 10px;font-size:.95rem;white-space:nowrap}
.icon{width:46px;height:46px;flex:none;border-radius:15px;border:2px solid var(--line);background:var(--card);font-size:1.3rem;display:grid;place-items:center;box-shadow:0 3px 0 var(--line);padding:0}
.icon:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
@media (max-width:560px){.pill.gem,.pill.lvp{display:none}.tb-name{font-size:.9rem}.pill{padding:4px 8px;font-size:.88rem}}
@media (max-width:380px){.pill.streak{display:none}}

/* ---------- Butonlar & kartlar ---------- */
.btn{--c:var(--blue);--cd:var(--blue-d);display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:0;border-radius:18px;
  padding:.7em 1.25em;background:var(--c);color:#fff;font-weight:900;font-size:1.08rem;box-shadow:0 5px 0 var(--cd);
  transition:transform .08s,box-shadow .08s;min-height:54px;text-decoration:none;line-height:1.15}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cd)}
.btn.y{--c:var(--sun);--cd:var(--sun-d);color:#3A2A00}.btn.g{--c:var(--leaf);--cd:var(--leaf-d)}
.btn.p{--c:var(--grape);--cd:var(--grape-d)}.btn.o{--c:var(--orange);--cd:var(--orange-d)}
.btn.r{--c:var(--rose);--cd:var(--rose-d)}.btn.t{--c:var(--teal);--cd:var(--teal-d)}
.btn.w{--c:var(--card);--cd:var(--line);color:var(--ink);border:2px solid var(--line)}
.btn.sm{min-height:42px;padding:.45em .9em;font-size:.95rem;border-radius:14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
html.hc .btn{outline:3px solid #000}
.card{background:var(--card);border:3px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
h1,h2,h3{margin:.15em 0 .4em;line-height:1.15;font-weight:900}
h1{font-size:clamp(1.7rem,5vw,2.5rem)}h2{font-size:clamp(1.3rem,3.8vw,1.85rem)}h3{font-size:1.15rem}
p{line-height:1.5;margin:.3em 0 .6em}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.head{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.head h2{margin:0;flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-weight:900;font-size:.95rem}
.chip.on{background:var(--grape);border-color:var(--grape);color:#fff}
.bar{height:14px;background:var(--sky2);border-radius:99px;overflow:hidden;border:2px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--leaf);transition:width .4s}

/* ---------- Ana ekran ---------- */
.hello{display:flex;gap:14px;align-items:center}
.bigav{font-size:3.4rem;width:86px;height:86px;border-radius:50%;background:var(--sky2);display:grid;place-items:center;border:4px solid var(--sun);flex:none}
.hello h1{margin:0}
.statrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.max{display:flex;gap:10px;align-items:center;margin-top:12px;padding-top:12px;border-top:2px dashed var(--line)}
.max .masc{font-size:2.2rem}
.mission{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:26px;padding:18px 20px;
  background:var(--sun);color:#3A2A00;box-shadow:0 7px 0 var(--sun-d);margin:4px 0 22px}
.mission:active{transform:translateY(5px);box-shadow:0 2px 0 var(--sun-d)}
.mission .me{font-size:3rem;flex:none}
.mission b{font-size:1.35rem;display:block}
.mission span{font-weight:800}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px;margin-bottom:22px}
.tile{position:relative;border-radius:24px;padding:14px 8px;min-height:128px;background:var(--card);border:3px solid var(--line);
  box-shadow:0 6px 0 var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:1.04rem;text-align:center}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--c)}
.tile .te{font-size:2.5rem;width:70px;height:70px;border-radius:22px;background:var(--cl);display:grid;place-items:center}
.tile .badge{position:absolute;top:8px;right:8px;background:var(--rose);color:#fff;border-radius:99px;min-width:26px;height:26px;padding:0 6px;display:grid;place-items:center;font-size:.85rem}
.tile.lock{opacity:.5}
.missions{display:grid;gap:10px}
.mrow{display:flex;align-items:center;gap:10px;font-weight:800}
.mrow .mi{font-size:1.5rem}
.mrow .bar{flex:1}
.mrow.done{color:var(--leaf)}
.chest{font-size:2.2rem}
.chestbig{font-size:5rem;display:inline-block;animation:wiggle 1s ease-in-out 2}

/* ---------- Harita ---------- */
.gradepick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.map{position:relative;padding:6px 0 20px}
.map::before{content:"";position:absolute;left:50%;top:30px;bottom:40px;width:10px;margin-left:-5px;border-radius:9px;
  background:repeating-linear-gradient(var(--sun) 0 18px,transparent 18px 32px);opacity:.9}
.mnode{position:relative;z-index:1;display:flex;align-items:center;gap:12px;width:min(100%,520px);margin:0 auto 24px;padding:0}
.mnode:nth-child(odd){transform:translateX(-12%)}
.mnode:nth-child(even){transform:translateX(12%);flex-direction:row-reverse;text-align:right}
@media (max-width:560px){.mnode:nth-child(odd),.mnode:nth-child(even){transform:none}}
.nbtn{width:94px;height:94px;border-radius:50%;border:5px solid #fff;background:var(--c);box-shadow:0 7px 0 rgba(0,0,0,.18);
  font-size:2.7rem;flex:none;display:grid;place-items:center;position:relative}
.nbtn:active{transform:translateY(4px)}
.nbtn.lock{filter:grayscale(1);opacity:.55}
.nbtn.cur::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:4px solid var(--c);animation:ring 1.6s ease-out infinite}
.nbtn .lk{position:absolute;bottom:-6px;right:-6px;font-size:1.4rem;background:var(--card);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;border:2px solid var(--line)}
.ninfo{flex:1;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:10px 14px;box-shadow:var(--shadow);min-width:0}
.ninfo b{display:block;font-size:1.06rem}
.ninfo small{color:var(--muted);font-weight:800}
.stars{color:var(--sun-d);letter-spacing:2px;font-size:1.1rem}
.boss .nbtn{border-radius:28px}

/* ---------- Ünite ---------- */
.uhero{display:flex;gap:14px;align-items:center;border-radius:26px;padding:16px;color:#fff;background:var(--c);margin-bottom:16px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.uhero .ue{font-size:3.4rem}
.uhero h2{margin:0}
.uacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:16px}
.uact{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 5px 0 var(--c);font-weight:900;font-size:1.08rem}
.uact:active{transform:translateY(3px)}
.uact .ae{font-size:2.2rem;width:56px;height:56px;border-radius:18px;background:var(--cl);display:grid;place-items:center;flex:none}
.uact small{display:block;color:var(--muted);font-weight:800;font-size:.88rem}
.loop{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:900;font-size:.85rem;color:var(--muted)}
.loop span{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:3px 8px}
.loop span.on{background:var(--leaf);color:#fff;border-color:var(--leaf)}

/* ---------- Ders kartları ---------- */
.slide{text-align:center}
.slide .vis{min-height:150px}
.slide .stx{font-size:clamp(1.1rem,3.2vw,1.35rem);font-weight:800;max-width:640px;margin:0 auto 14px}
.dots{display:flex;gap:6px;justify-content:center;margin:8px 0 14px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--grape);width:28px;border-radius:9px}

/* ---------- Soru ekranı ---------- */
.qscreen{max-width:840px;margin:0 auto}
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.prog{flex:1;height:18px;background:var(--card);border:3px solid var(--line);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--grape);transition:width .35s}
.qmeta{font-weight:900;white-space:nowrap}
.bubble{display:flex;gap:10px;align-items:flex-start;margin:4px 0 12px}
.masc{font-size:2.6rem;flex:none;animation:bob 2.6s ease-in-out infinite;line-height:1}
.say{position:relative;flex:1;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:12px 14px;
  font-weight:900;font-size:clamp(1.12rem,3.4vw,1.5rem);display:flex;gap:10px;align-items:center;line-height:1.3}
.say::before{content:"";position:absolute;left:-13px;top:16px;border:10px solid transparent;border-right-color:var(--line);border-left:0}
.say .ptxt{flex:1}
.vis{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px;margin:4px 0 16px}
.vis:empty{display:none}
.story{background:var(--card);border:3px dashed var(--line);border-radius:18px;padding:12px 14px;font-weight:800;font-size:1.12rem;max-width:640px;line-height:1.5}
.ansarea{margin-bottom:12px}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:720px){.choices{grid-template-columns:repeat(4,1fr)}.choices.c3{grid-template-columns:repeat(3,1fr)}.choices.c2{grid-template-columns:repeat(2,1fr)}}
.choices.c3{grid-template-columns:repeat(3,1fr)}
.choice{min-height:78px;border-radius:20px;border:3px solid var(--line);background:var(--card);font-weight:900;font-size:clamp(1.35rem,4.6vw,2rem);
  box-shadow:0 5px 0 var(--line);padding:8px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15}
.choice.txt{font-size:clamp(1rem,3.2vw,1.25rem)}
.choice:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.choice.right{background:var(--okbg);border-color:var(--leaf);box-shadow:0 5px 0 var(--leaf);animation:pop .35s}
.choice.wrong{background:var(--nobg);border-color:var(--rose);animation:shake .35s;opacity:.6}
.choice svg{max-width:100%;height:auto}
.qfoot{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.hintbox p{background:var(--hintbg);color:var(--hintink);border-left:7px solid var(--sun);border-radius:14px;padding:10px 14px;font-weight:800;margin:8px 0}
.hintbox .hv{display:flex;justify-content:center;margin:8px 0}
.fb{margin-top:12px}
.fbc{border-radius:22px;padding:14px 16px;border:3px solid var(--leaf);background:var(--okbg);animation:pop .3s}
.fbc.no{border-color:var(--sun-d);background:var(--hintbg);color:var(--hintink)}
.fbc .ft{font-size:1.4rem;font-weight:900;display:flex;gap:8px;align-items:center}
.fbc ul{margin:6px 0 4px;padding-left:22px;font-weight:800;line-height:1.6}
.fbc .row{margin-top:10px}
.reflect{margin-top:10px}
.reflect .chips button{cursor:pointer}

/* Sayı tuşları */
.numdisp{font-size:2.3rem;font-weight:900;min-height:66px;border:4px solid var(--grape);border-radius:18px;background:var(--card);
  text-align:center;padding:6px 10px;margin:0 auto 12px;max-width:280px;letter-spacing:.04em}
.numdisp.empty{color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:300px;margin:0 auto}
.key{min-height:58px;font-size:1.55rem;font-weight:900;border-radius:16px;border:3px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.key.ok{background:var(--leaf);border-color:var(--leaf);color:#fff;box-shadow:0 4px 0 var(--leaf-d)}
.key.del{background:var(--sky2)}

/* Oyun kaplamaları */
.sk-balloon .choices{row-gap:42px;padding-bottom:28px}
.sk-balloon .choice{border:0;color:#fff;min-height:112px;border-radius:50% 50% 46% 46%/56% 56% 44% 44%;background:var(--bc);
  box-shadow:inset -10px -12px 0 rgba(0,0,0,.13);position:relative;animation:bob 2.8s ease-in-out infinite;animation-delay:calc(var(--d) * -.7s);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.sk-balloon .choice::after{content:"";position:absolute;left:50%;bottom:-28px;width:2px;height:28px;background:var(--muted)}
.sk-balloon .choice:nth-child(4n+1){--bc:var(--rose)}.sk-balloon .choice:nth-child(4n+2){--bc:var(--blue)}
.sk-balloon .choice:nth-child(4n+3){--bc:var(--leaf)}.sk-balloon .choice:nth-child(4n+4){--bc:var(--grape)}
.sk-balloon .choice.right{animation:popout .45s forwards}
.sk-fish .ansarea{background:linear-gradient(#8AD5FF,#2F7BEA);border-radius:26px;padding:20px 26px 20px 14px}
.sk-fish .choice{border:0;color:#fff;border-radius:60% 40% 40% 60%/50%;background:var(--fc);position:relative;margin-right:20px;animation:swim 3.2s ease-in-out infinite alternate;animation-delay:calc(var(--d) * -.8s);box-shadow:none}
.sk-fish .choice::after{content:"";position:absolute;right:-22px;top:50%;margin-top:-16px;border:16px solid transparent;border-left:22px solid var(--fc);border-right:0}
.sk-fish .choice:nth-child(4n+1){--fc:var(--orange)}.sk-fish .choice:nth-child(4n+2){--fc:var(--rose)}
.sk-fish .choice:nth-child(4n+3){--fc:var(--grape)}.sk-fish .choice:nth-child(4n+4){--fc:var(--teal)}
.sk-train .choices::before{content:"🚂";font-size:3rem;display:none}
.sk-train .choice{border:0;color:#fff;border-radius:14px 14px 6px 6px;background:var(--wc);position:relative;margin-bottom:18px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.sk-train .choice::after{content:"● ●";position:absolute;bottom:-26px;left:0;right:0;color:var(--ink);font-size:1.4rem;letter-spacing:22px}
.sk-train .choice:nth-child(4n+1){--wc:var(--rose)}.sk-train .choice:nth-child(4n+2){--wc:var(--blue)}
.sk-train .choice:nth-child(4n+3){--wc:var(--leaf)}.sk-train .choice:nth-child(4n+4){--wc:var(--orange)}
.train-head{font-size:2.6rem;text-align:center;margin-bottom:4px}
.sk-hunt .choices{grid-template-columns:repeat(4,1fr)}
.sk-hunt .choice{min-height:64px;font-size:clamp(1.1rem,4vw,1.5rem)}
.track{position:relative;height:64px;border-radius:18px;background:var(--card);border:3px solid var(--line);margin-bottom:10px;overflow:hidden}
.track .road{position:absolute;left:0;right:0;top:50%;border-top:4px dashed var(--line)}
.track .car{position:absolute;top:8px;font-size:2.4rem;transition:left .6s;transform:scaleX(-1)}
.track .flag{position:absolute;right:8px;top:10px;font-size:2rem}
.track.rocket{height:auto;display:flex;align-items:center;gap:10px;padding:8px 12px}
.track.rocket .fuel{flex:1;height:22px;border-radius:99px;background:var(--sky2);overflow:hidden;border:2px solid var(--line)}
.track.rocket .fuel i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--sun));transition:width .5s}
.arena{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:10px 16px;margin-bottom:10px}
.arena .boss{font-size:3.6rem;transition:transform .2s}
.arena .boss.hit{animation:hit .5s}
.hearts{font-size:1.4rem;letter-spacing:2px}
.hunt-target{font-size:2.2rem;font-weight:900}

/* Görseller */
.objs{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:380px;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1}
.objs.sm{font-size:1.5rem;max-width:200px}
.o{display:inline-flex;flex-direction:column;align-items:center}
.o sub{font-size:.75rem;font-weight:900;color:var(--muted);line-height:1.2}
.o.x{position:relative;opacity:.4}
.o.x::after{content:"";position:absolute;left:-3px;right:-3px;top:42%;height:4px;background:var(--rose);transform:rotate(-30deg);border-radius:3px}
.ogap{width:12px}
.eqv{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.grp{background:var(--card);border:3px dashed var(--line);border-radius:18px;padding:8px;min-width:54px;min-height:54px;display:grid;place-items:center}

.bigeq{font-size:clamp(2rem,8vw,3.2rem);font-weight:900;display:flex;align-items:center;gap:.3em;flex-wrap:wrap;justify-content:center}

.frac i{font-style:normal;padding-top:.04em}
.blocks{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.bset{display:flex;gap:5px;align-items:flex-end;flex-wrap:wrap;max-width:330px}
.hund{width:64px;height:64px;background-color:var(--orange);border:2px solid var(--orange-d);border-radius:4px;
  background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);background-size:6.2px 6.2px}
.ten{width:11px;height:64px;background-color:var(--blue);border:2px solid var(--blue-d);border-radius:3px;
  background-image:linear-gradient(rgba(255,255,255,.4) 1px,transparent 1px);background-size:100% 6.2px}
.ones{display:grid;grid-template-columns:repeat(5,11px);gap:3px}
.one{width:11px;height:11px;background:var(--leaf);border:2px solid var(--leaf-d);border-radius:2px}
.blab{font-weight:900;font-size:.9rem;color:var(--muted);text-align:center;margin-top:4px}
.pattern{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pt{min-width:58px;height:58px;border-radius:16px;background:var(--card);border:3px solid var(--line);display:grid;place-items:center;font-size:1.7rem;font-weight:900;padding:0 8px}
.pt.q{border:4px dashed var(--grape);color:var(--grape)}
.colop{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:2rem;font-weight:900;text-align:right;line-height:1.25;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:10px 18px}
.colop .ln{border-top:4px solid var(--ink);margin-top:4px}
.svgv{max-width:100%;height:auto;display:block}
.money{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.coin{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.95rem;color:#5A4300;
  background:radial-gradient(circle at 35% 30%,#FFF3B0,#E8B930 60%,#B8860B);border:3px solid #9C7A10;box-shadow:0 3px 0 rgba(0,0,0,.2);flex:none}
.coin.kr{background:radial-gradient(circle at 35% 30%,#FFFFFF,#C9CED6 60%,#8B929C);border-color:#7A818B;color:#333;width:50px;height:50px}
.note{width:96px;height:52px;border-radius:8px;display:grid;place-items:center;font-weight:900;color:#fff;font-size:1.05rem;border:3px solid rgba(0,0,0,.2);
  box-shadow:0 3px 0 rgba(0,0,0,.2);position:relative;overflow:hidden;flex:none;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.note::before{content:"";position:absolute;right:-12px;top:6px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.25)}
.n5{background:#8C6BB1}.n10{background:#D8414B}.n20{background:#2E9E5B}.n50{background:#F08A24}.n100{background:#2D7FC1}.n200{background:#B5508C}
.shop{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.item{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px 12px;text-align:center;font-weight:900}
.item .ie{font-size:2rem;display:block}
.pict{display:grid;gap:6px;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:10px 14px}
.pict .pr{display:flex;align-items:center;gap:10px;font-size:1.5rem}
.pict .pl{min-width:92px;font-size:1rem;font-weight:900}
table.dt{border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;font-weight:900;font-size:1.1rem}
table.dt td,table.dt th{border:3px solid var(--line);padding:8px 14px;text-align:center}
.scene{position:relative;width:230px;height:170px;background:var(--card);border:3px solid var(--line);border-radius:18px}
.scene span{position:absolute;font-size:2.4rem;line-height:1}
.tf{font-size:1.4rem}

/* Etkileşimli soru tipleri */
.order-slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:70px;margin-bottom:14px}
.oslot{min-width:64px;height:64px;border-radius:16px;border:3px dashed var(--line);display:grid;place-items:center;font-size:1.6rem;font-weight:900;background:transparent}
.oslot.f{border-style:solid;border-color:var(--grape);background:var(--card)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:grid;gap:10px}
.mi{min-height:72px;border-radius:18px;border:3px solid var(--line);background:var(--card);font-weight:900;font-size:1.5rem;padding:6px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--line)}
.mi.sel{border-color:var(--grape);background:rgba(136,87,242,.13)}
.mi.ok{border-color:var(--leaf);background:var(--okbg);opacity:.75}
.mi.bad{animation:shake .35s;border-color:var(--rose)}
.drag-wrap{display:grid;gap:14px}
.pool,.basket{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;min-height:86px;padding:12px;border-radius:22px}
.pool{background:var(--card);border:3px solid var(--line)}
.basket{border:4px dashed var(--leaf);background:var(--okbg);position:relative}
.basket .blbl{position:absolute;top:-14px;left:16px;background:var(--leaf);color:#fff;font-weight:900;border-radius:99px;padding:2px 12px;font-size:.9rem}
.dg{font-size:2.3rem;width:62px;height:62px;border-radius:16px;border:2px solid transparent;background:transparent;display:grid;place-items:center;touch-action:none;user-select:none;padding:0}
.dg.fixed{opacity:.85;cursor:default}
.dg svg{width:50px;height:50px}
.ghost{position:fixed;pointer-events:none;z-index:80;font-size:2.6rem;transform:translate(-50%,-50%) scale(1.15)}
.plates{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.plate{min-width:120px;min-height:120px;border-radius:50%;border:5px solid var(--line);background:var(--card);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px;padding:14px;position:relative;font-size:1.5rem}
.plate .pk{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);font-size:1.6rem;background:var(--card);border-radius:50%}
.plate span{cursor:pointer}
.gridq{display:inline-grid;gap:4px;background:var(--line);padding:4px;border-radius:12px;touch-action:none}
.gcell{width:44px;height:44px;border-radius:7px;background:var(--card);border:0;padding:0;font-size:1.4rem}
.gcell.on{background:var(--leaf)}
@media (max-width:400px){.gcell{width:36px;height:36px}}
.counter{font-weight:900;font-size:1.25rem;text-align:center;margin:10px 0}
.buildq{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.bslot{width:70px;height:70px;border-radius:16px;border:3px dashed var(--grape);display:grid;place-items:center;font-size:1.9rem;font-weight:900;background:var(--card)}
.tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tilebtn{min-width:62px;height:62px;border-radius:16px;border:3px solid var(--line);background:var(--card);font-size:1.6rem;font-weight:900;box-shadow:0 4px 0 var(--line)}
.tilebtn.op{background:var(--sky2)}
.barsq{display:flex;gap:14px;justify-content:center;align-items:flex-end;flex-wrap:wrap}
.bcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.bcol .bv{width:46px;background:var(--blue);border-radius:10px 10px 0 0;transition:height .2s;min-height:4px}
.bcol .bctl{display:flex;gap:4px}
.bcol .bctl button{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:900;font-size:1.2rem}
.bcol .bn{font-weight:900;font-size:1.3rem}
.clockwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.clockwrap svg{touch-action:none;max-width:280px;width:72vw}
.digital{font-size:2rem;font-weight:900;background:var(--ink);color:#7CFFB2;border-radius:12px;padding:4px 16px;font-family:ui-monospace,Menlo,Consolas,monospace}
.stagebar{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.stagebar span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;border:3px solid var(--line);background:var(--card)}
.stagebar span.now{border-color:var(--grape);background:var(--grape);color:#fff}
.stagebar span.done{border-color:var(--leaf);background:var(--leaf);color:#fff}
.stageq{text-align:center;font-weight:900;font-size:1.2rem;margin:4px 0 12px}
.tray{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:70px;align-items:center;border:4px dashed var(--sun-d);border-radius:20px;padding:10px;margin:10px 0}
.tray .money-x{cursor:pointer}
.coins-pick{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.coins-pick button{background:none;border:0;padding:0}

/* Lab */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.tabs .chip{flex:none;cursor:pointer}
.labbox{min-height:300px}
.labctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.bignum{font-size:clamp(2.4rem,9vw,3.6rem);font-weight:900;text-align:center}
.words{text-align:center;font-weight:900;color:var(--grape);font-size:1.2rem}

/* Rozet / avatar / ilerleme */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.bdg{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:14px 8px;text-align:center}
.bdg .be{font-size:2.6rem;display:block}
.bdg.off{opacity:.45;filter:grayscale(1)}
.bdg b{display:block;margin-top:4px}
.bdg small{color:var(--muted);font-weight:700;font-size:.82rem}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.avb{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:10px 4px;font-size:2.6rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.avb small{font-size:.85rem;font-weight:900}
.avb.sel{border-color:var(--sun-d);background:var(--hintbg)}
.skrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:2px dashed var(--line)}
.skrow:last-child{border-bottom:0}
.skrow .se{font-size:1.8rem}
.skrow b{display:block}
.lvl{font-weight:900;font-size:.9rem;white-space:nowrap}
.tbl{width:100%;border-collapse:collapse;font-weight:800}
.tbl td,.tbl th{padding:8px 6px;border-bottom:2px solid var(--line);text-align:left}
.tbl th{color:var(--muted);font-size:.85rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--sky);border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.kpi b{display:block;font-size:1.6rem}
.kpi small{color:var(--muted);font-weight:800}
textarea{width:100%;min-height:120px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:.8rem}
.txtin{width:100%;font-size:1.6rem;font-weight:900;padding:14px 16px;border-radius:18px;border:4px solid var(--grape);background:var(--card);color:var(--ink);text-align:center}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:2px dashed var(--line);font-weight:800}
.switch:last-child{border-bottom:0}
.tog{width:62px;height:36px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.tog.on{background:var(--leaf)}
.tog.on::after{left:30px}

.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:10px}

.pcard:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.pcard.sel{border-color:var(--sun-d)}
.pcard.add{border-style:dashed}

.pcard small{color:var(--muted);font-weight:800;font-size:.9rem}
.gbtn small{display:block}

.wiz{max-width:560px;margin:30px auto;text-align:center}
.wiz .logo{font-size:4.2rem;display:block;animation:bob 2.6s ease-in-out infinite}
.wiz h1{font-size:clamp(2rem,7vw,2.9rem);letter-spacing:.01em}
.gbtns{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gbtn{min-height:120px;border-radius:24px;border:0;color:#fff;font-weight:900;font-size:1.3rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--c);box-shadow:0 6px 0 rgba(0,0,0,.2)}
.gbtn span{font-size:2.4rem}

/* Modal, bildirim, efektler */
#modal{position:fixed;inset:0;background:rgba(15,25,55,.55);display:grid;place-items:center;z-index:50;padding:16px}
#modal[hidden]{display:none}
.mbox{background:var(--card);border-radius:28px;padding:22px;max-width:460px;width:100%;text-align:center;border:4px solid var(--line);animation:pop .3s;max-height:88vh;overflow:auto}
.mbox .mbe{font-size:4rem;display:block}
#toast{pointer-events:none;position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);z-index:60;background:var(--ink);color:var(--paper);
  font-weight:900;border-radius:18px;padding:12px 18px;max-width:92vw;text-align:center;transition:transform .3s;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast{visibility:hidden}#toast.show{transform:translate(-50%,0);visibility:visible}
.fly{position:fixed;font-weight:900;font-size:1.4rem;pointer-events:none;z-index:70;animation:flyup 1.1s forwards;color:var(--leaf-d);text-shadow:0 2px 0 #fff}
.fly.coin{color:var(--sun-d)}
#fx i{position:fixed;top:-14px;width:10px;height:16px;border-radius:3px;z-index:65;pointer-events:none;animation:fall 1.4s ease-in forwards}
.pin{display:flex;gap:10px;justify-content:center;margin:10px 0}
.pin i{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink)}
.pin i.f{background:var(--ink)}
.resstars{font-size:3.4rem;letter-spacing:6px}
.resstars .off{filter:grayscale(1);opacity:.3}
.unlock{background:var(--hintbg);color:var(--hintink);border-radius:18px;padding:12px;font-weight:900;margin:8px 0;font-size:1.1rem}

@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes popout{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(0);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes swim{0%{transform:translateX(-6px)}100%{transform:translateX(8px)}}
@keyframes flyup{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-60px)}}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@keyframes ring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.25);opacity:0}}
@keyframes hit{0%{transform:translateX(0)}20%{transform:translateX(14px) rotate(8deg)}40%{transform:translateX(-10px)}60%{transform:translateX(6px)}100%{transform:none}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmt(n){
  if(typeof n!=='number')return String(n);

}

/* Sayıyı Türkçe yazıya çevir (0–999.999) */
function numTR(n){
  const B=['','bir','iki','üç','dört','beş','altı','yedi','sekiz','dokuz'];
  const O=['','on','yirmi','otuz','kırk','elli','altmış','yetmiş','seksen','doksan'];
  if(n===0)return 'sıfır';
  const u1000=x=>{const h=Math.floor(x/100),t=Math.floor(x/10)%10,o=x%10;return [h?(h===1?'yüz':B[h]+' yüz'):'',O[t],B[o]].filter(Boolean).join(' ');};
  const th=Math.floor(n/1000),r=n%1000;
  return [th?(th===1?'bin':u1000(th)+' bin'):'',u1000(r)].filter(Boolean).join(' ');
}
/* Sayıyı çözümle: 582 -> "500 + 80 + 2" */
function expand(n){const s=String(n);return s.split('').map((d,i)=>Number(d)*Math.pow(10,s.length-1-i)).filter(x=>x>0).map(fmt).join(' + ');}

/* Yanıta yakın çeldiriciler üret */
function near(a,k=3,o={}){
  const min=o.min!=null?o.min:0;const out=[];const cand=[];
  if(o.extra)o.extra.forEach(x=>cand.push(x));
  if(o.tens)cand.push(a+10,a-10);
  if(Number.isInteger(a)&&a>=10){const sw=Number(String(a).split('').reverse().join(''));if(sw!==a)cand.push(sw);}
  let deltas=[1,-1,2,-2,10,-10,3,-3];
  if(Math.abs(a)>=100)deltas=deltas.concat([100,-100,20,-20]);
  if(Math.abs(a)>=1000)deltas=deltas.concat([1000,-1000]);
  shuffle(deltas).forEach(d=>cand.push(a+d));
  for(const c of cand){if(out.length>=k)break;if(c!==a&&c>=min&&Number.isFinite(c)&&!out.includes(c))out.push(c);}
  let x=1;while(out.length<k){const c=a+x*4+out.length;if(c!==a&&c>=min&&!out.includes(c))out.push(c);x++;}
  return shuffle([a].concat(out));
}

  if(!S.dailyMissions||S.dailyMissions.date!==t)S.dailyMissions={date:t,q:0,puzzle:0,game:0,chest:false,session:false};

  if(!S.weekly||S.weekly.week!==w)S.weekly={week:w,q:0,games:0,problems:0,lessons:0,days:[],done:false};
  if(!S.weekly.days.includes(t))S.weekly.days.push(t);
  hist();
  if(S.streak>=3)unlockBadge('streak3');
  saveProgress();
}

/* ---------------- Ödüller ---------------- */
const needXP=l=>60+l*40;
function computeLevel(){let lv=1,rest=S.xp;while(rest>=needXP(lv)){rest-=needXP(lv);lv++;}return{lv,rest};}
function giveXP(n){
  if(!n)return;S.xp+=n;floatFx('+'+n+' XP','xp');updateLevel();
}
function updateLevel(){
  const {lv}=computeLevel();
  if(lv>S.level){S.level=lv;sfx('level');toast('🎉 Seviye '+lv+'! Harikasın!');confetti(30);}
  S.level=lv;renderTop();
}
function giveCoins(n){if(!n)return;S.coins+=n;floatFx('+'+n+' 🪙','coin');renderTop();}
function unlockBadge(id){
  if(S.badges.includes(id))return;const b=BADGES.find(x=>x.id===id);if(!b)return;
  S.badges.push(id);S.gems+=1;sfx('badge');
  setTimeout(()=>toast(`<span style="font-size:2rem">${b.e}</span><br>Yeni rozet: ${esc(b.n)}! +1 💎`,3200),400);
  saveProgress();
}
function checkBadges(){
  const c=k=>S.stats.bySkill[k]||0;
  if(c('count')+c('compare')+c('place')+c('round')>=30)unlockBadge('number');
  if(c('add')>=30)unlockBadge('add');if(c('sub')>=30)unlockBadge('sub');
  if(c('mul')>=40)unlockBadge('mul');if(c('div')>=25)unlockBadge('div');
  if(c('geo')+c('angle')+c('perimeter')+c('area')>=20)unlockBadge('geo');
  if(c('fraction')+c('decimal')>=20)unlockBadge('frac');
  if(c('time')>=15)unlockBadge('time');if(c('money')>=15)unlockBadge('money');
  if(c('problem')>=15)unlockBadge('problem');if(c('pattern')>=15)unlockBadge('pattern');
  if(S.stats.games>=10)unlockBadge('gamer');if(S.stats.thinking>=10)unlockBadge('thinker');
}

/* ---------------- Ses ---------------- */
let AC=null;
function sfx(type){
  if(!S||!S.settings.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const seq={ok:[[660,.08],[880,.13]],no:[[330,.09],[294,.12]],level:[[523,.1],[659,.1],[784,.1],[1047,.22]],
      badge:[[784,.1],[988,.1],[1175,.2]],tap:[[520,.03]],boss:[[140,.14],[110,.26]],hit:[[300,.05],[600,.09]],
      coin:[[988,.05],[1319,.09]],win:[[523,.12],[659,.12],[784,.12],[1047,.12],[1319,.25]]}[type]||[];
    let t=AC.currentTime;
    seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type==='boss'?'sawtooth':'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(type==='no'?0.045:0.11,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);t+=d;});
  }catch(e){}
}
function speak(text){
  if(!S||!S.settings.sound)return;
  try{
    if(!('speechSynthesis' in window))return;
    let t=String(text).replace(/<[^>]+>/g,' ')
      .replace(/(\d+)\/(\d+)/g,'$2 de $1').replace(/\+/g,' artı ').replace(/[−-]/g,' eksi ').replace(/×/g,' çarpı ')
      .replace(/÷/g,' bölü ').replace(/=/g,' eşittir ').replace(/☐|\?/g,' kaç ').replace(/≈/g,' yaklaşık ')
      .replace(/[^\p{L}\p{N}\s.,:]/gu,' ');
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';u.rate=.92;
    const v=speechSynthesis.getVoices().find(v=>/^tr/i.test(v.lang));if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------------- Efektler ---------------- */
function toast(msg,ms){const t=$('#toast');t.innerHTML=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),ms||2300);}
function floatFx(txt,kind){
  const el=document.createElement('div');el.className='fly '+kind;el.textContent=txt;
  const a=$(kind==='coin'?'#tb-coin':'#tb-xp');const r=a&&!$('#topbar').hidden?a.getBoundingClientRect():{left:innerWidth/2,top:60,width:0,height:0};
  el.style.left=(r.left+r.width/2)+'px';el.style.top=(r.top+r.height+8)+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),1150);
}
function reduced(){return window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;}
function confetti(n){
  if(reduced())return;const box=$('#fx');const cols=['#FFC63A','#2F7BEA','#21A659','#8857F2','#FF8736','#F2557A'];
  for(let i=0;i<(n||36);i++){const p=document.createElement('i');p.style.left=Math.random()*100+'vw';p.style.background=pick(cols);
    p.style.animationDelay=(Math.random()*.35)+'s';p.style.animationDuration=(1.1+Math.random()*.8)+'s';box.appendChild(p);setTimeout(()=>p.remove(),2400);}
}
function modal(html,opt){
  opt=opt||{};const m=$('#modal');m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false;
  m.onclick=e=>{if(e.target===m&&opt.close!==false)closeModal();};
  const f=m.querySelector('[autofocus],button,input');if(f)setTimeout(()=>f.focus(),50);return m.firstElementChild;
}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';}
function confirmBox(text,yes,yesLabel){
  const b=modal(`<span class="mbe">🦊</span><h2>${text}</h2><div class="row" style="justify-content:center"><button class="btn w" data-x="no">Hayır</button><button class="btn r" data-x="yes">${yesLabel||'Evet'}</button></div>`);

  let t=w.reduce((a,b)=>a+b,0)*Math.random();for(let i=0;i<skills.length;i++){t-=w[i];if(t<=0)return skills[i];}return skills[0];
}
const GEN_MT={add:'toplama',sub:'cikarma',mul:'carpim',div:'bolme',problem:'problem',fraction:'kesir',time:'zaman',money:'para',geo:'geometri',measure:'olcme',data:'veri',pattern:'oruntu',place:'basamak',count:'sayi',compare:'sayi'};
function genFor(skill,g,opts){opts=opts||{};const d=opts.d||chooseDiff(g,skill);let q;
  try{q=(GEN[skill]||GEN.add)(g,d,opts);}catch(e){console.warn('gen error',skill,e);q=GEN.add(g,1);}
  q.skill=q.skill||skill;q.d=d;q.g=g;return q;}
function unitSkills(g,from,to){const s=new Set();UNITS[g].slice(from,to).forEach(u=>u.skills.forEach(k=>s.add(k)));return Array.from(s);}
function gradeSkills(g){return unitSkills(g,0,8);}

/* Seçenekleri standart hale getir */
function normChoices(q){
  if(!q.choices)return;
  let ch=q.choices.map(c=>(c&&typeof c==='object')?{v:String(c.v),h:c.h}:{v:String(c),h:typeof c==='number'?fmt(c):fH(c)});
  const seen=new Set();ch=ch.filter(c=>{if(seen.has(c.v))return false;seen.add(c.v);return true;});
  const a=String(q.ans);if(!ch.some(c=>c.v===a))ch.unshift({v:a,h:typeof q.ans==='number'?fmt(q.ans):fH(q.ans)});
  if(!q.keep)ch=shuffle(ch);q.choices=ch;
}
function eqAns(v,a){if(typeof a==='number'){const n=parseFloat(String(v).replace(',','.'));return Math.abs(n-a)<1e-9;}return String(v).trim()===String(a).trim();}

RENDER.steps=(q,area,done)=>{let si=0;

    const sa=$('.stagearea',area);if(!st.type)st.type='mc';if(st.choices&&!st._n){normChoices(st);st._n=1;}
    if(last){RENDER[st.type](st,sa,done);area._key=sa._key;area._reset=sa._reset;area._mark=v=>{sa._mark&&sa._mark(v);};return;}
    let wrongs=0,locked=false;
    RENDER[st.type](st,sa,(v,el)=>{
      if(locked)return;
      if(eqAns(v,st.ans)){locked=true;sfx('ok');if(el)el.classList.add('right');setTimeout(()=>{si++;run();},550);}
      else{sfx('no');wrongs++;q.attempts++;if(!q.recorded){recordAnswer(q,false,0);q.recorded=true;}recordMistake(q.mt==='akil'?'akil':'problem');
        if(el){el.classList.add('wrong');el.disabled=true;}
        if(wrongs>=2){locked=true;if(sa._mark)sa._mark(st.ans);$$('button',sa).forEach(x=>{if(!x.classList.contains('right'))x.disabled=true;});sa.insertAdjacentHTML('beforeend',`<div class="fbc no" style="margin-top:10px"><div class="ft">💡 Birlikte bakalım</div><p style="font-weight:800">${esc(st.explain||'')}</p><button class="btn p" id="stnext">Devam ➜</button></div>`);$('#stnext',area).onclick=()=>{si++;run();};}
        else toast(pick(ENCOURAGE),1600);}
    });
    area._key=sa._key;
  };

};

let SES=null;const TIMERS=[];
function addTimer(t){TIMERS.push(t);return t;}
function stopTimers(){while(TIMERS.length){const t=TIMERS.pop();clearInterval(t);clearTimeout(t);}}
function startSession(o){
  SES=Object.assign({i:0,correct:0,firstTry:0,answered:0,run:0,hints:0,t0:Date.now(),skillsSeen:{}},o);
  if(SES.boss)SES.hp=SES.boss.hp;
  if(SES.timer){SES.left=SES.timer;addTimer(setInterval(()=>{if(!SES)return;SES.left--;const el=$('#tleft');if(el)el.textContent=SES.left;if(SES.left<=0)endSession();},1000));}
  loadQuestion();
}
function loadQuestion(){
  if(!SES)return;
  if(SES.boss&&SES.hp<=0)return endSession();
  if(!SES.timer&&SES.i>=SES.total)return endSession();
  let q;try{q=SES.gen(SES.i,SES);}catch(e){console.warn(e);q=genFor('add',S.grade,{d:1});}
  if(!q.type)q.type='mc';if(q.type==='tf')q.type='mc';
  if(q.type==='steps'&&q.stages&&q.stages.length)q.ans=q.stages[q.stages.length-1].ans;
  if(!q.hints||!q.hints.length)q.hints=['Soruyu dikkatlice tekrar oku.','Bir resim çizerek düşün.'];
  Object.assign(q,{attempts:0,fa:0,hint:0,t0:Date.now(),solved:false,recorded:false});
  SES.q=q;renderQuestion();
}
function sessionHeader(){
  const s=SES;let meta='',extra='';
  if(s.timer)meta=`⏱ <span id="tleft">${s.left}</span> sn`;else meta=`${Math.min(s.i+1,s.total)} / ${s.total}`;
  const pct=s.timer?(s.correct/Math.max(1,s.correct+3)*100):(s.i/s.total*100);
  if(s.boss)extra=`<div class="arena"><div><b>${esc(s.boss.n)}</b><div class="hearts">${'❤️'.repeat(Math.max(0,s.hp))}${'🖤'.repeat(s.boss.hp-Math.max(0,s.hp))}</div></div><span class="boss" id="bossE">${s.boss.e}</span><span style="font-size:2.6rem">${S.avatar}⚔️</span></div>`;
  else if(s.skin==='rocket')extra=`<div class="track rocket"><span style="font-size:2rem">🚀</span><div class="fuel"><i style="width:${s.correct/s.total*100}%"></i></div><span style="font-size:1.6rem">🌕</span></div>`;
  else if(s.skin==='race')extra=`<div class="track"><div class="road"></div><span class="car" style="left:calc(${s.correct/s.total*100}% * .82)">🏎️</span><span class="flag">🏁</span></div>`;
  else if(s.skin==='train')extra=`<div class="train-head">🚂💨</div>`;
  return `<div class="qtop"><button class="icon" data-act="quit" aria-label="Çık">✕</button><div class="prog" aria-hidden="true"><i style="width:${pct}%"></i></div><span class="qmeta">${meta}</span></div><div class="center" style="font-weight:900;color:var(--muted);margin:-4px 0 6px">${esc(s.title||'')}</div>${extra}`;
}
function renderQuestion(){
  const q=SES.q;const view=$('#view');const skin=SES.skin&&q.type==='mc'?'sk-'+SES.skin:'';
  view.innerHTML=`<div class="qscreen ${skin}">${sessionHeader()}
    <div class="bubble"><span class="masc" aria-hidden="true">🦊</span><div class="say"><span class="ptxt">${q.promptH||esc(q.prompt)}</span><button class="icon" data-act="read" aria-label="Soruyu sesli oku">🔊</button></div></div>
    <div class="vis">${q.vis||''}</div>

    <div class="fb" id="fb"></div></div>`;
  const area=$('#ans');
  (RENDER[q.type]||RENDER.mc)(q,area,checkAnswer);

  view.focus({preventScroll:true});window.scrollTo(0,0);
}
function showHint(){
  const q=SES&&SES.q;if(!q||q.solved)return;
  if(q.hint>=q.hints.length){revealAnswer(true);return;}
  q.hint++;SES.hints++;q.hinted=true;
  const box=$('#hintbox');let h=`<p>💡 ${esc(q.hints[q.hint-1])}</p>`;
  if(q.hint===2&&q.hintVis)h+=`<div class="hv">${q.hintVis}</div>`;
  box.insertAdjacentHTML('beforeend',h);speak(q.hints[q.hint-1]);
  const btn=$('[data-act=hint]');if(btn&&q.hint>=q.hints.length)btn.innerHTML='👀 Cevabı göster';
}
function checkAnswer(val,el){
  const q=SES&&SES.q;if(!q||q.solved)return;
  const ok=eqAns(val,q.ans);const rt=(Date.now()-q.t0)/1000;
  if(ok)onCorrect(q,el,rt);else onWrong(q,val,el,rt);
}
function onCorrect(q,el,rt){
  q.solved=true;sfx('ok');const first=q.attempts===0&&!q.matchErrs;
  if(el)el.classList.add('right');
  SES.correct++;SES.answered++;if(first)SES.firstTry++;SES.run++;
  if(!q.recorded){recordAnswer(q,true,rt);q.recorded=true;}
  if(q.poolItem){q.poolItem.n++;q.poolItem.due=S.stats.q+4;if(q.poolItem.n>=2)S.practice=S.practice.filter(x=>x!==q.poolItem);}
  giveXP(first?2:1);giveCoins(1);
  if(SES.run>0&&SES.run%5===0){giveXP(10);toast('🔥 5 doğru üst üste! +10 XP',1800);}
  if(SES.boss){SES.hp--;sfx('hit');const b=$('#bossE');if(b){b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');}$('.hearts')&&($('.hearts').innerHTML='❤️'.repeat(Math.max(0,SES.hp))+'🖤'.repeat(SES.boss.hp-Math.max(0,SES.hp)));}
  if(SES.skin==='rocket'){const f=$('.fuel i');if(f)f.style.width=(SES.correct/SES.total*100)+'%';}
  if(SES.skin==='race'){const c=$('.car');if(c)c.style.left=`calc(${SES.correct/SES.total*100}% * .82)`;}
  const hb=$('[data-act=hint]');if(hb)hb.remove();
  if(SES.timer){setTimeout(nextQuestion,350);return;}
  const praise=pick(PRAISE);speak(praise);
  const steps=(q.steps||[]).slice(0,4);
  let html=`<div class="fbc"><div class="ft">⭐ ${praise}</div>${steps.length?`<ul>${steps.map(s=>`<li>${s}</li>`).join('')}</ul>`:''}`;
  const wantReflect=q.reflect&&Math.random()<.3&&!SES.oneTry;
  if(wantReflect)html+=`<div class="reflect"><b>🗣️ Nasıl çözdün?</b><div class="chips" style="margin-top:6px">${q.reflect.map((r,i)=>`<button class="chip" data-rf="${i}">${esc(r)}</button>`).join('')}</div></div>`;
  html+=`<div class="row">${(q.alt&&S.grade>=2&&!SES.oneTry)?'<button class="btn t sm" id="altbtn">🔀 Başka yolla çöz</button>':''}<button class="btn p" id="nextbtn">Devam ➜</button></div></div>`;
  $('#fb').innerHTML=html;
  $$('[data-rf]').forEach(b=>b.onclick=()=>{$$('[data-rf]').forEach(x=>x.disabled=true);b.classList.add('on');giveXP(1);toast('🗣️ Harika açıklama! Matematikçiler böyle düşünür.',1800);});
  const ab=$('#altbtn');if(ab)ab.onclick=()=>showAlt(q);
  $('#nextbtn').onclick=nextQuestion;setTimeout(()=>{const n=$('#nextbtn');if(n)n.focus({preventScroll:true});},60);
  if(!reduced())$('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
  saveProgress();
}
function showAlt(q){const a=Object.assign({},q.alt);normChoices(a);
  const box=$('#fb .fbc');const div=document.createElement('div');div.className='reflect';div.innerHTML=`<b>🔀 ${esc(a.prompt)}</b><div class="choices c3" style="margin-top:8px">${a.choices.map((c,i)=>`<button class="choice txt" data-ai="${i}">${c.h}</button>`).join('')}</div>`;
  box.insertBefore(div,box.querySelector('.row'));const ab=$('#altbtn');if(ab)ab.remove();
  $$('[data-ai]',div).forEach(b=>b.onclick=()=>{const v=a.choices[+b.dataset.ai].v;if(v===String(a.ans)){b.classList.add('right');sfx('ok');giveXP(3);toast('🔀 Süper! Aynı sonuca farklı yoldan ulaştın.',2000);$$('[data-ai]',div).forEach(x=>x.disabled=true);}else{b.classList.add('wrong');b.disabled=true;sfx('no');}});
}
function onWrong(q,val,el,rt){
  sfx('no');q.attempts++;q.fa++;SES.run=0;
  const mt=analyzeMistake(q,val);recordMistake(mt);
  if(!q.recorded){recordAnswer(q,false,rt);q.recorded=true;}
  if(el){el.classList.add('wrong');el.disabled=true;}
  const area=$('#ans');if(area&&area._reset&&q.type==='num')area._reset();
  if(SES.oneTry||SES.timer){revealAnswer(false);return;}
  let msg=pick(ENCOURAGE);if(q.gridNote){msg=q.gridNote;q.gridNote=null;}
  if(q.type==='share'&&val==='left')msg='Dağıtılmamış nesneler var. Hepsini dağıt!';
  if(q.type==='share'&&val==='uneq')msg='Tabaklar eşit değil. Her tabakta aynı sayıda olmalı!';
  if(q.type==='money'&&q.lastSum!=null)msg=q.lastSum>q.target?`Kasada ${tl(q.lastSum)} var, bu fazla. Biraz çıkar!`:`Kasada ${tl(q.lastSum)} var. ${tl(q.target-q.lastSum)} daha gerekiyor!`;
  if(mt==='basamak'&&(q.skill==='add'||q.skill==='sub'))msg='Neredeyse! Elde / onluk bozma adımını kontrol et. 💡';
  if(q.partial!=null&&eqAns(val,q.partial))msg='Yarıya kadar geldin! Bir işlem daha yapman gerekiyor. 💪';
  $('#fb').innerHTML=`<div class="fbc no"><div class="ft">🤔 ${esc(msg)}</div></div>`;
  if(q.fa===2&&q.hint<2){showHint();if(q.hint<2)showHint();}
  else if(q.fa===1&&q.hint===0)showHint();
  if(q.fa>=3)revealAnswer(false);
}
function revealAnswer(byButton){
  const q=SES.q;if(q.solved)return;q.solved=true;
  if(!q.recorded){recordAnswer(q,false,(Date.now()-q.t0)/1000);q.recorded=true;}
  SES.answered++;SES.run=0;addPractice(q);
  const area=$('#ans');if(area&&area._mark)area._mark(q.ans);
  const hb=$('[data-act=hint]');if(hb)hb.remove();
  if(SES.timer){setTimeout(nextQuestion,900);return;}
  const ansH=typeof q.ans==='number'?fmt(q.ans):(q.ans==='ok'||q.type==='steps'?'':fH(q.ans));

  $('#fb').innerHTML=`<div class="fbc no"><div class="ft">💡 Birlikte bakalım</div><ul>${(q.steps||[]).slice(0,4).map(s=>`<li>${s}</li>`).join('')}</ul>${choiceH&&(q.type!=='steps'||typeof q.ans==='number')?`<p style="font-weight:900">Doğru cevap: ${choiceH}</p>`:''}<p class="muted" style="font-weight:800">Bu soruya benzer bir soruyu sonra “Tekrar Et” bölümünde yeniden çözeceğiz. 🔄</p><div class="row"><button class="btn p" id="nextbtn">Devam ➜</button></div></div>`;

}
function nextQuestion(){if(!SES)return;SES.i++;loadQuestion();}
function endSession(){
  if(!SES)return;stopTimers();const s=SES;SES=null;try{speechSynthesis&&speechSynthesis.cancel();}catch(e){}
  const total=s.timer?s.answered:Math.max(1,s.answered);
  const r={title:s.title,mode:s.mode,correct:s.correct,firstTry:s.firstTry,total,acc:s.answered?s.firstTry/s.answered:0,bossWin:s.boss?s.hp<=0:false,msgs:[],xp:0,primary:null};
  S.stats.sessions++;

/* ---------------- Kayıt: cevaplar, hatalar, tekrar havuzu ---------------- */
function recordAnswer(q,correct,rt){
  const g=q.g||S.grade;const sk=skillState(g,q.skill);
  sk.a++;sk.t+=Math.min(rt||0,120);
  if(correct){sk.c++;sk.cr++;}else{sk.w++;sk.cr=0;}
  const target=correct?(q.hinted?70:100):0;sk.m=Math.round(sk.m*0.82+target*0.18);
  S.stats.q++;if(correct){S.stats.c++;S.stats.bySkill[q.skill]=(S.stats.bySkill[q.skill]||0)+1;}
  const h=hist();h.q++;if(correct)h.c++;
  S.dailyMissions.q++;S.weekly.q++;
  if(q.skill==='problem'&&correct){S.stats.problems++;S.weekly.problems++;}
  checkBadges();
}
function analyzeMistake(q,val){
  const n=parseFloat(String(val).replace(',','.'));
  if(q.skill==='add'&&q.carry&&typeof q.ans==='number'&&(n===q.ans-10||n===q.ans-100))return 'basamak';
  if(q.skill==='sub'&&q.borrow&&typeof q.ans==='number'&&(n===q.ans+10||n===q.ans+100))return 'basamak';
  if(q.partial!=null&&n===q.partial)return 'problem';
  return q.mt||GEN_MT[q.skill]||'sayi';
}
function recordMistake(mt){S.mistakes[mt]=(S.mistakes[mt]||0)+1;const gd=gradeData(S.grade);gd.mistakes[mt]=(gd.mistakes[mt]||0)+1;}
function addPractice(q){if(!q.skill)return;S.practice.push({g:q.g||S.grade,skill:q.skill,d:Math.max(1,(q.d||1)-1),due:S.stats.q+3,n:0,mt:q.mt});if(S.practice.length>40)S.practice.shift();}
function duePractice(g){return S.practice.filter(p=>p.g===g&&p.due<=S.stats.q);}
function practiceQuestion(item){const v=item.n===0?0:(item.n===1?1:2);const q=genFor(item.skill,item.g,{d:item.d,v});q.poolItem=item;return q;}

function skillRow(g,k){const sk=skillState(g,k),L=masteryLevel(sk),info=SKILLS[k];
  return `<div class="skrow"><span class="se">${info.e}</span><div><b>${info.n}</b><div class="bar"><i style="width:${sk.a?sk.m:0}%;background:${L.c}"></i></div></div><span class="lvl">${L.e} ${L.n}</span></div>`;}
function masteryLevel(sk){if(!sk||sk.a===0)return{e:'⚪',n:'Başlamadı',c:'var(--line)'};if(sk.m>=85&&sk.a>=15)return{e:'🏆',n:'Usta',c:'#D99B00'};if(sk.m>=65)return{e:'🌳',n:'Güçlü',c:'#167E41'};if(sk.m>=40)return{e:'🌿',n:'Gelişiyor',c:'#21A659'};return{e:'🌱',n:'Öğreniyor',c:'#8BCF9F'};}
function completeUnit(g,i,r){const us=unitState(g,i);const first=!us.done;us.done=true;us.best=Math.max(us.best,r.acc);
  const stars=r.acc>=.9?3:r.acc>=.7?2:1;us.stars=Math.max(us.stars,stars,us.lesson&&us.problems?Math.min(3,stars+1):stars);
  if(first){giveXP(100);r.xp+=100;unlockBadge('unit');r.msgs.push('🎉 BÖLÜM TAMAMLANDI! +100 XP');
    if(i!==3&&i!==7&&i<7){unitState(g,i+1).unlocked=true;r.msgs.push(`🔓 ${REGIONS[UNITS[g][i+1].r].n} açıldı!`);}

    r.big=true;}
  r.primary={label:'🗺️ Haritaya dön',fn:()=>{NAV.length=0;NAV.push({name:'home'});go('map',null,false);}};}

function planDaily(g){const opened=UNITS[g].map((u,i)=>i).filter(i=>unitState(g,i).unlocked);const cur=opened[opened.length-1]||0;
  const learned=unitSkills(g,0,cur+1);const current=UNITS[g][cur].skills;const plan=[];
  const due=duePractice(g).slice(0,2);due.forEach(p=>plan.push({pool:p}));
  while(plan.length<4)plan.push({skill:pickSkillAdaptive(g,learned)});
  for(let k=0;k<5;k++)plan.push({skill:pickSkillAdaptive(g,current)});
  plan.push({skill:'problem'});
  const weak=learned.slice().sort((a,b)=>skillState(g,a).m-skillState(g,b).m);plan.push({skill:weak[0]||current[0]},{skill:weak[1]||current[0]});
  return plan;}
SCREENS.daily=()=>{const g=S.grade;const plan=planDaily(g);const cnt={};plan.forEach(p=>{const k=p.pool?p.pool.skill:p.skill;cnt[k]=(cnt[k]||0)+1;});
  V_(`${head('Bugünün Matematik Görevi','🎯')}<section class="card"><div class="row"><span style="font-size:3rem">🦊</span><p style="margin:0;font-weight:800;flex:1">Bugünkü planını senin için hazırladım: önce eski konuları hatırlayacağız, sonra yeni konuya geçip bir problem çözeceğiz. Yaklaşık 10–15 dakika!</p></div></section>
  <section class="card"><h3>📋 Bugünkü plan (${plan.length} soru)</h3>${Object.keys(cnt).map(k=>`<div class="mrow"><span class="mi">${SKILLS[k].e}</span><span style="min-width:150px">${SKILLS[k].n}</span><div class="bar"><i style="width:${cnt[k]/plan.length*100}%;background:var(--blue)"></i></div><span>%${Math.round(cnt[k]/plan.length*100)}</span></div>`).join('')}
  <p class="muted" style="font-weight:700;margin-top:10px">1. Tekrar (eski konular) → 2. Yeni konu → 3. Problem → 4. Zayıf konular → 5. Bir mini oyun</p></section>
  <button class="btn y wide" id="startDaily" style="font-size:1.3rem;min-height:66px">Göreve başla 🚀</button>`);
  $('#startDaily').onclick=()=>go('session',{title:'🎯 Bugünün Görevi',mode:'daily',total:plan.length,gen:i=>{const p=plan[i];return p.pool?practiceQuestion(p.pool):genFor(p.skill,g);},

};

  if(h.sec%30===0)saveProgress();},10000);

try{const C=window.Capacitor;if(C&&C.Plugins&&C.Plugins.App){C.Plugins.App.addListener('backButton',()=>{if(!$('#modal').hidden){closeModal();return;}back();});}}catch(e){}
window.addEventListener('beforeunload',()=>{if(S)saveProgress();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&S)saveProgress();});
if('speechSynthesis' in window){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}catch(e){}}

  if(!PROF.list.length){go('onboard',0,false);return;}
  if(!PROF.active||PROF.list.length>1){go('who',null,false);return;}  /* birden fazla oyuncu varsa önce "Kim oynuyor?" */
  touchDay();go('home',null,false);}
init();
